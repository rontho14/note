# XcodeGen spec. Note.xcodeproj is generated from this file; never edit it by hand.
name: Note
options:
  bundleIdPrefix: com.rontho14
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  DebugE2E: debug
  Release: release
packages:
  NoteCore:
    path: Packages/NoteCore
  NoteStore:
    path: Packages/NoteStore
  NoteTelemetry:
    path: Packages/NoteTelemetry
  NoteUI:
    path: Packages/NoteUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_MEMORY_SAFETY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    DebugE2E:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG E2E
targets:
  Note:
    type: application
    platform: iOS
    sources: [Note]
    dependencies:
      - package: NoteStore
      - package: NoteTelemetry
      - package: NoteUI
    info:
      path: Note/Info.plist
      properties:
        CFBundleDisplayName: Note
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rontho14.note
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  NoteE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NoteE2ETests]
    dependencies:
      - target: Note
      - package: NoteCore
      - package: NoteUI
    info:
      path: NoteE2ETests/Info.plist
      properties: {}
schemes:
  Note:
    build:
      targets:
        Note: all
    run:
      config: Debug
    test:
      config: DebugE2E
      targets:
        - NoteE2ETests
        - package: NoteUI/NoteUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
