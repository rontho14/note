# XcodeGen spec. Note.xcodeproj is generated from this file; never edit it by hand.
name: Note
options:
  bundleIdPrefix: com.rontho14
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  NoteCore:
    path: Packages/NoteCore
  NoteUI:
    path: Packages/NoteUI
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_UPCOMING_FEATURE_INTERNAL_IMPORTS_BY_DEFAULT: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_MEMORY_SAFETY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Note:
    type: application
    platform: iOS
    sources: [Note]
    dependencies:
      - package: NoteUI
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rontho14.note
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Note
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
